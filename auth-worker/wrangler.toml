name = "salta-auth"
main = "worker.js"
compatibility_date = "2026-09-29"
workers_dev = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionStore"]

[[ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "21061101"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "LOGIN_ACCOUNT_LIMITER"
namespace_id = "21061102"
simple = { limit = 20, period = 60 }
