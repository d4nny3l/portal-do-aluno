<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>SALTA — Folha-resposta</title><style>@page{size:A4;margin:0}body{margin:0;background:#ddd;font-family:Arial,sans-serif}.page{width:210mm;height:297mm;background:#fff;margin:0 auto;position:relative;overflow:hidden}.m{position:absolute;width:12mm;height:12mm;background:#000}.tl{left:10mm;top:10mm}.tr{right:10mm;top:10mm}.br{right:10mm;bottom:10mm}.bl{left:10mm;bottom:10mm}h1{position:absolute;top:17mm;width:100%;text-align:center;font-size:22px;margin:0}.sub{position:absolute;top:28mm;width:100%;text-align:center;font-size:11px;color:#555}.head{position:absolute;top:38mm;left:25mm;right:25mm;border-bottom:1px solid #aaa;padding-bottom:7mm;font-size:11px}.line{display:inline-block;width:65mm;border-bottom:1px solid #555;margin:0 8mm}.inst{position:absolute;top:51mm;width:100%;text-align:center;font-size:10px;color:#555}.grid{position:absolute;top:61mm;left:25mm;right:25mm;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:11.8mm}.cell{display:flex;align-items:center;gap:3mm;font-size:10px}.num{width:7mm;text-align:right;font-weight:bold}.b{width:6.5mm;height:6.5mm;border:1.4px solid #111;border-radius:50%;display:inline-block}.foot{position:absolute;bottom:18mm;width:100%;text-align:center;font-size:9px;color:#777}@media print{body{background:#fff}.page{margin:0}}</style></head><body><div class="page"><div class="m tl"></div><div class="m tr"></div><div class="m br"></div><div class="m bl"></div><h1>SALTA</h1><div class="sub">FOLHA-RESPOSTA • 20 QUESTÕES</div><div class="head">ALUNO:<span class="line"></span>TURMA:<span class="line" style="width:25mm"></span></div><div class="inst">Marque apenas uma alternativa por questão, preenchendo o círculo completamente.</div><div class="grid" id="grid"></div><div class="foot">SALTA — Ferramenta Educacional • Desenvolvido por Prof. Dannyel Moisés</div></div><script>const g=document.getElementById("grid"),L=["A","B","C","D","E"];for(let i=1;i<=20;i++){let d=document.createElement("div");d.className="cell";d.innerHTML='<span class="num">'+i+'</span>'+L.map(x=>'<span class="b" aria-label="'+x+'"></span>').join("");g.appendChild(d)}</script></body></html>
