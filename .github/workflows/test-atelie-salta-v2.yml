name: SALTA DESIGN-SALTA-03 — Atelier direct/bulk fidelity isolated (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'plataforma/atelie-salta*'
      - 'plataforma/tests/atelie-salta*.test.mjs'
      - 'scripts/verify-atelie-salta-v2-*.mjs'
      - '.github/workflows/test-atelie-salta-v2.yml'
permissions:
  contents: read
jobs:
  atelier-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict laboratory-only scope, binary fonts, license and original layouts
        run: |
          node scripts/verify-atelie-salta-v2-scope.mjs
          node --check plataforma/atelie-salta-v2.mjs
          for file in plataforma/atelie-salta-v2-{fixtures,calendar,matrix,controls,compositions}.mjs; do node --check "$file"; done
          node --check scripts/verify-atelie-salta-v2-browser.mjs
          node --check scripts/verify-atelie-salta-v2-fidelity-browser.mjs
          node --check scripts/verify-atelie-salta-v2-03-browser.mjs
          node --test plataforma/tests/atelie-salta.test.mjs plataforma/tests/atelie-salta-v2.test.mjs plataforma/tests/atelie-salta-v2-fidelity.test.mjs plataforma/tests/atelie-salta-v3.test.mjs
      - name: Existing academic, OMR, camera and platform regressions (no writes)
        run: |
          node --test corretor/v2/tests/*.test.mjs stats-worker/tests/*.test.mjs plataforma/tests/*.test.mjs
      - name: Install browser engines only in CI
        run: |
          npm install --prefix "$RUNNER_TEMP/salta-atelie" --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.1
          node "$RUNNER_TEMP/salta-atelie/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Six responsive viewports, 68 icons, 22 concepts, keyboard and no remote requests
        run: |
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-atelie/node_modules/playwright/index.mjs" node scripts/verify-atelie-salta-v2-browser.mjs
      - name: Fidelity functional tests — calendar, date picker, matrices, inputs and 22 decisions
        run: |
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-atelie/node_modules/playwright/index.mjs" node scripts/verify-atelie-salta-v2-fidelity-browser.mjs
      - name: DESIGN-03 actual direct/bulk interaction — keyboard, touch, scroll, 3 engines
        run: |
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-atelie/node_modules/playwright/index.mjs" node scripts/verify-atelie-salta-v2-03-browser.mjs
      - name: Scope remains limited
        run: |
          node scripts/verify-atelie-salta-v2-scope.mjs
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-salta-03-direct-bulk-evidence-not-published
          path: |
            tmp/atelie-v2-evidence/
            tmp/atelie-v2-fidelity-evidence/
            tmp/atelie-v3-interaction-evidence/
          if-no-files-found: warn
