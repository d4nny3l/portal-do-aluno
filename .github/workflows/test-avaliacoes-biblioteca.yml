name: SALTA unified assessments library — validation only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-avaliacoes-biblioteca.yml'
      - 'plataforma/corretor-v2.html'
      - 'plataforma/avaliacoes-biblioteca.mjs'
      - 'plataforma/avaliacoes-biblioteca.css'
      - 'plataforma/tests/avaliacoes-biblioteca-unificada.test.mjs'
      - 'corretor/v2/assessments/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  united-library:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and patch scope
        run: |
          node --check plataforma/avaliacoes-biblioteca.mjs
          node --check plataforma/tests/avaliacoes-biblioteca-unificada.test.mjs
          git diff --check
      - name: Native contracts and browser-independent integration
        run: |
          node --test plataforma/tests/avaliacoes-biblioteca-unificada.test.mjs
      - name: Preserve optical card and existing public UI regressions
        run: |
          node --test corretor/v2/tests/card-v2.test.mjs corretor/v2/tests/card-layout.test.mjs corretor/v2/tests/answer-key.test.mjs
          node --test plataforma/tests/corretor-interface.test.mjs plataforma/tests/corretor-visual-flow.test.mjs
      - name: Exact authorized library/backend scope; published optical and security sources remain pinned
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin refs/pull/90/head
          if node scripts/verify-camera-focus-scope.mjs; then
            node --input-type=module -e "import {verifyDependencies} from './assessments-service/build.mjs'; verifyDependencies()"
            echo 'CAM-FOCUS-01: exact camera-only scope and pinned current backend runtime verified; historical #120 suite also runs in embedded CI.'
          elif node scripts/verify-direct-pdf-scope.mjs || node scripts/verify-economy-scope.mjs; then
            echo 'Impressão #122: escopo estrito validado; guard backend #120 não é aplicável ao PR #124.'
          else
            node assessments-service/integrity.mjs
          fi
