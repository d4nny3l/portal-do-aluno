name: SALTA embedded library candidate — synthetic only
on:
  pull_request:
    paths:
      - 'assessments-service/**'
      - 'corretor/v2/assessments/private-contract-adapter.mjs'
      - 'plataforma/avaliacoes-biblioteca.mjs'
      - 'plataforma/corretor-v2.html'
      - 'plataforma/tests/avaliacoes-biblioteca-unificada.test.mjs'
      - 'docs/avaliacoes/BIBLIOTECA_QUADROS_118.md'
      - '.github/workflows/test-assessments-embedded.yml'
permissions:
  contents: read
jobs:
  local-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify the strictly authorized print-only #122 delta
        id: print_scope
        run: |
          if node scripts/verify-direct-pdf-scope.mjs || node scripts/verify-economy-scope.mjs; then
            echo 'print_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'print_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Classify scoped frontend-only changes (#127/#128/#130)
        id: camera_scope
        run: |
          if node scripts/verify-product-ux-scope.mjs || node scripts/verify-single-shot-scope.mjs || node scripts/verify-camera-focus-scope.mjs; then
            echo 'camera_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'camera_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read pinned historical backend/gateway fixture sources
        if: steps.print_scope.outputs.print_only != 'true'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin refs/pull/90/head refs/pull/74/head
          git cat-file -e 72695b469d7e9b3140371a196ce235918b3df307^{commit}
          git cat-file -e 7080d2de0b5a01bbe417b71732221a869e7a4d42^{commit}
      - if: steps.print_scope.outputs.print_only != 'true'
        run: npm ci --prefix assessments-lab --ignore-scripts --no-audit --no-fund
      - name: PR 136 diagnostic — independently rebuild pinned baseline and candidate twice (no approval or deployment)
        if: github.event.pull_request.number == 136
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import path from 'node:path';
          const root=process.cwd(),require=createRequire(path.join(root,'assessments-lab/package.json'));
          const {build,version}=require('esbuild');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const worker='assessments-service/worker.mjs',base='0fa1b402cad9d4d84a5376ce1bd132da7df20b7c';
          const matrix=JSON.parse(readFileSync('assessments-service/dependencies.json'));
          const original=execFileSync('git',['show',base+':'+worker]);
          const current=readFileSync(worker);
          const baseline=async()=>build({absWorkingDir:root,entryPoints:[path.join(root,worker)],bundle:true,write:false,format:'esm',platform:'browser',target:'es2022',keepNames:true,metafile:true,plugins:[{name:'baseline-worker-bytes',setup(b){b.onLoad({filter:/assessments-service[\\/]worker\.mjs$/},()=>({contents:original.toString(),loader:'js'}))}}]});
          const candidate=async()=>build({absWorkingDir:root,entryPoints:[path.join(root,worker)],bundle:true,write:false,format:'esm',platform:'browser',target:'es2022',keepNames:true,metafile:true});
          const prior=await baseline(),a=await candidate(),b=await candidate();
          const graph=x=>Object.keys(x.metafile.inputs).map(p=>path.relative(root,path.resolve(root,p.split('?')[0])).split(path.sep).join('/')).sort();
          for(const x of [prior,a,b])if(JSON.stringify(graph(x))!==JSON.stringify(matrix.inputs.map(y=>y.path).sort()))throw Error('Unexpected graph');
          if(hash(prior.outputFiles[0].text)!==matrix.expectedBundleSha256)throw Error('Historical bundle mismatch');
          if(a.outputFiles[0].text!==b.outputFiles[0].text)throw Error('Non-reproducible candidate');
          console.log('PR136-CANDIDATE-HASHES '+JSON.stringify({version,baselineBundle:hash(prior.outputFiles[0].text),bundle:hash(a.outputFiles[0].text),workerSha256:hash(current),workerBlob:execFileSync('git',['hash-object',worker],{encoding:'utf8'}).trim(),inputs:graph(a).length,repeated:true}));
          NODE
      - if: steps.print_scope.outputs.print_only != 'true' && steps.camera_scope.outputs.camera_only != 'true'
        run: node assessments-service/integrity.mjs
      - if: steps.print_scope.outputs.print_only != 'true' && steps.camera_scope.outputs.camera_only != 'true'
        run: node --test assessments-service/tests/build.test.mjs
      - name: Current frontend/backend, synthetic Auth, local D1 and unchanged gateway regressions
        if: steps.print_scope.outputs.print_only != 'true' && steps.camera_scope.outputs.camera_only != 'true'
        run: node assessments-service/test-composition.mjs
      - name: Frontend-only — verify unchanged dependencies and execute original #120 guard and historical suite
        if: steps.camera_scope.outputs.camera_only == 'true'
        run: |
          node scripts/verify-product-ux-scope.mjs || node scripts/verify-single-shot-scope.mjs || node scripts/verify-camera-focus-scope.mjs
          node --input-type=module -e "import {verifyDependencies} from './assessments-service/build.mjs'; verifyDependencies()"
          git worktree add --detach "$RUNNER_TEMP/salta-120" ce74c520a464a17ed7fda2991df92f984a04d8e7
          cd "$RUNNER_TEMP/salta-120"
          npm ci --prefix assessments-lab --ignore-scripts --no-audit --no-fund
          node assessments-service/integrity.mjs
          node --test assessments-service/tests/build.test.mjs
          node assessments-service/test-composition.mjs
      - name: Candidate build only — no Worker configuration or deployment
        if: steps.print_scope.outputs.print_only != 'true'
        run: |
          node assessments-service/build.mjs
          node assessments-service/build-gateway.mjs
          node assessments-service/custody/build.mjs
          node assessments-service/custody/config.mjs
      - name: Isolated real browser — synthetic sessions, exact frame recovery and optical correction
        if: steps.print_scope.outputs.print_only != 'true'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/salta-browser" --no-save --ignore-scripts playwright@1.65.1
          node "$RUNNER_TEMP/salta-browser/node_modules/playwright/cli.js" install --with-deps chromium
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-browser/node_modules/playwright/index.mjs" node assessments-service/tests/embedded-browser.mjs
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-browser/node_modules/playwright/index.mjs" node assessments-service/tests/editor-frontend-browser.mjs
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-browser/node_modules/playwright/index.mjs" node assessments-service/tests/lifecycle-browser.mjs
      - uses: actions/upload-artifact@v4
        if: steps.print_scope.outputs.print_only != 'true'
        with:
          name: embedded-library-candidate-not-published
          path: assessments-service/dist/
      - run: git diff --check
