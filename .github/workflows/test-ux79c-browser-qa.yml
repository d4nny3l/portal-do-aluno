name: SALTA UX-79C real-browser QA (synthetic, isolated)
on:
  pull_request:
    branches:
      - fix/ux-79c-vis-02-ci-composed-20261121
    paths:
      - '.github/workflows/test-ux79c-browser-qa.yml'
      - 'plataforma/tests/browser-qa/**'
permissions:
  contents: read
jobs:
  chromium-real-app:
    if: github.event.pull_request.head.ref == 'fix/ux-79c-format-select-event-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CI: 'true'
    steps:
      - name: Checkout exact PR HEAD without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify HEAD, unchanged app and restricted QA-only diff
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE=d2d67eb4dd96a1431a9440f341406700d601a602
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" HEAD -- plataforma/avaliacoes-biblioteca.mjs plataforma/corretor-v2.css plataforma/avaliacoes-biblioteca.css corretor/v2
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/qa-changed-files.txt"
          echo "QA diff from approved PR #92:"
          cat "$RUNNER_TEMP/qa-changed-files.txt"
          python3 - <<'PY'
          import pathlib
          actual=set(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'qa-changed-files.txt').read_text().splitlines())
          allowed={'.github/workflows/test-ux79c-browser-qa.yml','plataforma/tests/browser-qa/qa_integrada.py','plataforma/tests/browser-qa/qa_synthetic_gateway.js','plataforma/corretor-v2.html'}
          assert actual == allowed, f'Unauthorized or incomplete QA diff: {sorted(actual ^ allowed)}'
          PY
          git diff --check "$BASE" HEAD
          git status --porcelain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - name: Install fixed Playwright and Chromium for CI only
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real HTML/JS/CSS in Chromium with synthetic gateway and denied outbound network
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python plataforma/tests/browser-qa/qa_integrada.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/salta-real-browser-qa" --expected-head "$PR_HEAD"
      - name: Upload synthetic-only browser reports, screenshots and network denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salta-ux79c-browser-qa-synthetic
          path: ${{ runner.temp }}/salta-real-browser-qa/
          if-no-files-found: warn
          retention-days: 7
