name: SALTA #122 economic A4 print — synthetic browser and PDF
on:
  pull_request:
    branches: [main]
    paths:
      - 'corretor/v2/omr/print-economy.mjs'
      - 'corretor/v2/omr/export.mjs'
      - 'corretor/v2/tests/economy-print.test.mjs'
      - 'plataforma/corretor-v2.html'
      - 'scripts/verify-economy-browser.mjs'
      - '.github/workflows/test-economy-print.yml'
permissions:
  contents: read
jobs:
  economy-print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract and syntax checks
        run: |
          node --check corretor/v2/omr/print-economy.mjs
          node --check corretor/v2/omr/export.mjs
          node --check corretor/v2/tests/economy-print.test.mjs
          node --check scripts/verify-economy-browser.mjs
          node --test corretor/v2/tests/economy-print.test.mjs
          git diff --check
      - name: Isolated Chromium print and PDF evidence, no production network
        run: |
          npm install --prefix "$RUNNER_TEMP/salta-browser" --no-save --ignore-scripts playwright@1.65.1
          node "$RUNNER_TEMP/salta-browser/node_modules/playwright/cli.js" install --with-deps chromium
          SALTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salta-browser/node_modules/playwright/index.mjs" node scripts/verify-economy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salta-122-economic-print-candidate-not-published
          path: tmp/economy-print-evidence/
          if-no-files-found: warn
