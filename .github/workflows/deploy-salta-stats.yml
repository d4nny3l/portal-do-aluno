name: Deploy SALTA Stats Worker

on:
  push:
    branches:
      - main
    paths:
      - "stats-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy salta-stats to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: stats-worker
