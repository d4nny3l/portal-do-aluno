name: Deploy SALTA Stats Worker

on:
  push:
    branches:
      - main
    paths:
      - "stats-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy salta-stats to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js for the Diario checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Worker syntax
        working-directory: stats-worker
        run: node --check worker.js

      - name: Run Diario regression tests
        run: node --test stats-worker/tests/diario-periods.test.mjs

      - name: Verify deployment secrets are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before deploying."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: stats-worker
