name: SALTA private assessment service
on:
  pull_request:
    paths:
      - "assessments-service/**"
      - "corretor/v2/assessments/**"
      - "docs/avaliacoes/**"
      - "auth-worker/**"
      - "assessments-lab/crypto/**"
      - "corretor/v2/omr/**"
      - ".github/workflows/test-assessments-service.yml"
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix assessments-lab --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          for file in assessments-service/*.mjs assessments-service/tests/*.mjs; do node --check "$file"; done
      - name: Full existing regressions and private service contracts
        run: node --test corretor/v2/tests/*.test.mjs plataforma/tests/*.test.mjs stats-worker/tests/*.test.mjs assessments-lab/tests/*.test.mjs assessments-service/tests/*.test.mjs
      - name: Isolated real Auth, Durable Object and D1
        run: node --test assessments-service/tests/d1-auth.integration.mjs
      - name: Existing encrypted laboratory HTTP compatibility
        run: |
          node assessments-lab/build.mjs
          node --test assessments-lab/tests/d1-http.integration.mjs
      - run: git diff --check HEAD^ HEAD
