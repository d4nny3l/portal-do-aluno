<script>


/* =========================================================
   FUNÇÕES BÁSICAS
   ========================================================= */


function numeroMath(numero) {

    if (Object.is(numero, -0)) {

        numero = 0;

    }


    if (Number.isInteger(numero)) {

        return numero.toString();

    }


    return numero
        .toFixed(10)
        .replace(/\.?0+$/, '');

}


function numeroBR(numero) {

    return numeroMath(numero)
        .replace('.', ',');

}


/* =========================================================
   MDC
   ========================================================= */


function mdc(a, b) {

    a = Math.abs(
        Math.round(a)
    );

    b = Math.abs(
        Math.round(b)
    );


    while (b !== 0) {

        const resto = a % b;

        a = b;

        b = resto;

    }


    return a;

}


/* =========================================================
   QUADRADO PERFEITO
   ========================================================= */


function ehQuadradoPerfeito(numero) {

    if (numero < 0) {

        return false;

    }


    return Number.isInteger(
        Math.sqrt(numero)
    );

}

function mdc(a, b) {
    a = Math.abs(Math.round(a));
    b = Math.abs(Math.round(b));

    while (b !== 0) {
        let resto = a % b;
        a = b;
        b = resto;
    }

    return a;
}


function ehInteiro(numero) {
    return Math.abs(numero - Math.round(numero)) < 1e-10;
}

function decimalParaFracao(numero) {

    /*
        Trabalhamos com o valor decimal
        em uma representação controlada,
        evitando os erros de ponto flutuante
        do JavaScript.
    */

    if (Number.isInteger(numero)) {

        return {
            numerador: numero,
            denominador: 1
        };

    }


    let texto =
        Math.abs(numero)
            .toFixed(10);


    /*
        Remove zeros desnecessários.
    */

    texto =
        texto.replace(
            /0+$/,
            ''
        );


    texto =
        texto.replace(
            /\.$/,
            ''
        );


    let partes =
        texto.split(".");


    let casas =
        partes[1]
            ? partes[1].length
            : 0;


    let denominador =
        Math.pow(
            10,
            casas
        );


    let numerador =
        parseInt(
            partes[0] +
            (
                partes[1]
                || ''
            )
        );


    if (numero < 0) {

        numerador =
            -numerador;

    }


    /*
        Simplificação da fração.
    */

    let divisor =
        mdc(
            Math.abs(numerador),
            denominador
        );


    numerador /=
        divisor;


    denominador /=
        divisor;


    return {

        numerador:
            numerador,
        denominador:
            denominador

    };

}

function fracaoLatex(numerador, denominador) {

    if (denominador === 1) {
        return `${numerador}`;
    }

    if (numerador < 0) {
        return `-\\frac{${Math.abs(numerador)}}{${denominador}}`;
    }

    return `\\frac{${numerador}}{${denominador}}`;
}

/* =========================================================
   SIMPLIFICA RADICAL
   ========================================================= */


function simplificarRadical(numero) {

    /*
        Se o número for inteiro,
        mantém exatamente a lógica original.
    */

    if (Number.isInteger(numero)) {

        let fator = 1;

        let radicando = numero;

        for (
            let i =
                Math.floor(
                    Math.sqrt(numero)
                );

            i >= 2;

            i--
        ) {

            const quadrado =
                i * i;

            if (
                numero % quadrado === 0
            ) {

                fator = i;

                radicando =
                    numero / quadrado;

                break;
            }
        }

        return {
            fator: fator,
            radicando: radicando
        };
    }


    /*
        Se for decimal,
        transforma em fração.
    */

    const texto =
        numero.toString();

    const partes =
        texto.split(".");


    const casas =
        partes[1]
            ? partes[1].length
            : 0;


    let denominador =
        Math.pow(
            10,
            casas
        );


    let numerador =
        Math.round(
            numero * denominador
        );


    /*
        Simplifica a fração pelo MDC.
    */

    const divisor =
        mdc(
            Math.abs(numerador),
            denominador
        );


    numerador /=
        divisor;


    denominador /=
        divisor;


    /*
        Verifica se o numerador
        é um quadrado perfeito.
    */

    const raizNumerador =
        Math.sqrt(
            Math.abs(numerador)
        );


    const raizDenominador =
        Math.sqrt(
            denominador
        );


    /*
        Exemplo:

        2,25 = 9/4

        √(9/4) = 3/2
    */

    if (
        Number.isInteger(raizNumerador) &&
        Number.isInteger(raizDenominador)
    ) {

        return {

    fator:
        raizNumerador,

    radicando:
        1,

    fracao:
        true,

    raizExata:
        true,

    numerador:
        raizNumerador,

    denominador:
        raizDenominador

};
    }


    /*
        Se o numerador tiver
        um quadrado perfeito,
        simplifica somente essa parte.

        Exemplo:

        18/25

        √(18/25)

        = 3√2 / 5
    */

    let fator =
        1;

    let novoNumerador =
        numerador;


    for (
        let i =
            Math.floor(
                Math.sqrt(
                    Math.abs(numerador)
                )
            );

        i >= 2;

        i--
    ) {

        const quadrado =
            i * i;


        if (
            numerador % quadrado === 0
        ) {

            fator = i;

            novoNumerador =
                numerador /
                quadrado;

            break;
        }
    }


    return {

        fator:
            fator,

        radicando:
            novoNumerador,

        fracao:
            true,

        numerador:
            novoNumerador,

        denominador:
            denominador

    };

}


/* =========================================================
   FRAÇÃO
   ========================================================= */


function fracao(
    numerador,
    denominador
) {

    return '\\frac{' +
        numerador +
        '}{' +
        denominador +
        '}';

}


/* =========================================================
   TERMO DA EQUAÇÃO
   ========================================================= */


function termoMath(
    valor,
    variavel,
    primeiro = false
) {


    if (valor === 0) {

        return '';

    }


    const absoluto =
        Math.abs(valor);


    let coeficiente = '';


    if (
        absoluto !== 1 ||
        variavel === ''
    ) {

        coeficiente =
            numeroMath(absoluto);

    }


    const termo =
        coeficiente +
        variavel;


    if (primeiro) {

        if (valor < 0) {

            return '-' + termo;

        }


        return termo;

    }


    if (valor < 0) {

        return ' - ' + termo;

    }


    return ' + ' + termo;

}


/* =========================================================
   MONTA EQUAÇÃO
   ========================================================= */


function montarEquacao(
    a,
    b,
    c
) {


    let equacao = '';


    equacao +=
        termoMath(
            a,
            'x^2',
            true
        );


    if (b !== 0) {

        equacao +=
            termoMath(
                b,
                'x'
            );

    }


    if (c !== 0) {

        equacao +=
            termoMath(
                c,
                ''
            );

    }


    if (equacao === '') {

        equacao = '0';

    }


    return '\\(' +
        equacao +
        ' = 0\\)';

}


/* =========================================================
   RAIZ RACIONAL
   ========================================================= */


function raizRacional(
    b,
    a,
    sinal,
    raizDelta
) {


    let numerador =
        -b +
        sinal * raizDelta;


    let denominador =
        2 * a;


    const divisor =
        mdc(
            numerador,
            denominador
        );


    if (divisor !== 0) {

        numerador /=
            divisor;

        denominador /=
            divisor;

    }


    if (denominador < 0) {

        numerador *= -1;

        denominador *= -1;

    }


    if (denominador === 1) {

        return numeroMath(
            numerador
        );

    }


    return fracao(
        numeroMath(numerador),
        numeroMath(denominador)
    );

}


/* =========================================================
   RAIZ IRRACIONAL
   ========================================================= */



function raizIrracional(
    b,
    a,
    sinal,
    delta
) {

    const radical =
        simplificarRadical(
            delta
        );


    /*
        CASO 1:
        A raiz do Delta é uma fração exata.

        Exemplo:

        √(9/25) = 3/5
    */

    if (
        radical.fracao &&
        radical.raizExata
    ) {

        let raizNumerador =
            radical.numerador;

        let raizDenominador =
            radical.denominador;


        let constante =
            -b;

        let denominador =
            2 * a;


        /*
            x = (-b ± raiz) / 2a

            raiz = raizNumerador / raizDenominador

            Então:

            x =
            (-b ± 3/5) / 2a

            Colocamos tudo no mesmo denominador.
        */

        let novoNumerador =
            constante *
            raizDenominador;

        let parteRaiz =
            sinal *
            raizNumerador;


        let novoDenominador =
            denominador *
            raizDenominador;


        /*
            Simplifica os termos quando
            possível.
        */

        let divisor =
            mdc(
                mdc(
                    Math.abs(
                        novoNumerador
                    ),
                    Math.abs(
                        parteRaiz
                    )
                ),
                Math.abs(
                    novoDenominador
                )
            );


        if (
            divisor !== 0 &&
            divisor !== 1
        ) {

            novoNumerador /=
                divisor;

            parteRaiz /=
                divisor;

            novoDenominador /=
                divisor;

        }


        /*
            Monta o numerador final.
        */

        let numeradorFinal;


        if (
            novoNumerador === 0
        ) {

            numeradorFinal =
                numeroMath(
                    parteRaiz
                );

        }

        else {

            if (
                parteRaiz > 0
            ) {

                numeradorFinal =
                    numeroMath(
                        novoNumerador
                    ) +
                    ' + ' +
                    numeroMath(
                        parteRaiz
                    );

            }

            else {

                numeradorFinal =
                    numeroMath(
                        novoNumerador
                    ) +
                    ' - ' +
                    numeroMath(
                        Math.abs(
                            parteRaiz
                        )
                    );

            }

        }


        if (
            novoDenominador === 1
        ) {

            return numeradorFinal;

        }


        return fracao(
            numeradorFinal,
            numeroMath(
                novoDenominador
            )
        );

    }


    /*
        CASO 2:
        Comportamento antigo.

        Continua funcionando normalmente
        para Delta inteiro e raiz irracional.
    */

    let constante =
        -b;


    let radicalCoef =
        sinal *
        radical.fator;


    let denominador =
        2 * a;


    let divisor =
        mdc(
            mdc(
                constante,
                radicalCoef
            ),
            denominador
        );


    if (
        divisor !== 0
    ) {

        constante /=
            divisor;

        radicalCoef /=
            divisor;

        denominador /=
            divisor;

    }


    if (
        denominador < 0
    ) {

        constante *= -1;

        radicalCoef *= -1;

        denominador *= -1;

    }


    let radicalTexto;


    if (
        Math.abs(
            radicalCoef
        ) === 1
    ) {

        radicalTexto =
            '\\sqrt{' +
            numeroMath(
                radical.radicando
            ) +
            '}';

    }

    else {

        radicalTexto =
            numeroMath(
                Math.abs(
                    radicalCoef
                )
            ) +
            '\\sqrt{' +
            numeroMath(
                radical.radicando
            ) +
            '}';

    }


    let numerador = '';


    if (
        constante !== 0
    ) {

        numerador +=
            numeroMath(
                constante
            );


        if (
            radicalCoef > 0
        ) {

            numerador +=
                ' + ' +
                radicalTexto;

        }

        else {

            numerador +=
                ' - ' +
                radicalTexto;

        }

    }

    else {

        if (
            radicalCoef < 0
        ) {

            numerador +=
                '-';

        }


        numerador +=
            radicalTexto;

    }


    if (
        denominador === 1
    ) {

        return numerador;

    }


    return fracao(
        numerador,
        numeroMath(
            denominador
        )
    );

}

/* =========================================================
   RESULTADO PADRÃO
   ========================================================= */


function resultadoCaixa(
    texto,

                Conferência pela Fórmula Resolutiva
            </span>

            <div class="matematica">

                \\[
                x=
                \\frac{
                -b\\pm\\sqrt{\\Delta}
                }{
                2a
                }
                \\]

                \\[
                \\Delta=
                ${numeroMath(delta)}
                \\]

                \\[
                x_1=
                ${resultadoX1}
                \\]

                \\[
                x_2=
                ${resultadoX2}
                \\]

            </div>

        </div>

    `;

}


/* =========================================================
   RAÍZES COMPLEXAS — CASO GERAL
   ========================================================= */


function obterRaizesComplexas() {


    const a =
        parseFloat(
            document.getElementById(
                'a'
            ).value
        );


    const b =
        parseFloat(
            document.getElementById(
                'b'
            ).value
        );


    const c =
        parseFloat(
            document.getElementById(
                'c'
            ).value
        );


    const delta =
        b*b -
        4*a*c;


    const moduloDelta =
        Math.abs(delta);


    const simplificacao =
        simplificarRadical(
            moduloDelta
        );


    const fator =
        simplificacao.fator;


    const radicando =
        simplificacao.radicando;


    let raizSimplificada;


    if (fator === 1) {

        raizSimplificada =
            '\\sqrt{' +
            numeroMath(
                radicando
            ) +
            '}';

    }

    else {

        raizSimplificada =
            numeroMath(fator) +
            '\\sqrt{' +
            numeroMath(
                radicando
            ) +
            '}';

    }


    let denominador =
        2*a;


    let real =
        -b;


    let imagCoef =
        fator;


    let divisor =
        mdc(
            mdc(
                Math.abs(real),
                Math.abs(imagCoef)
            ),
            Math.abs(denominador)
        );


    if (divisor === 0) {

        divisor = 1;

    }


    real /=
        divisor;


    imagCoef /=
        divisor;


    denominador /=
        divisor;


    if (denominador < 0) {

        real *= -1;

        imagCoef *= -1;

        denominador *= -1;

    }


    let parteReal = '';


    if (real !== 0) {

        parteReal =
            numeroMath(real);

    }


    let parteImag;


    if (
        Math.abs(imagCoef) === 1
    ) {

        parteImag =
            'i\\sqrt{' +
            numeroMath(
                radicando
            ) +
            '}';

    }

    else {

        parteImag =
            numeroMath(
                Math.abs(imagCoef)
            ) +
            'i\\sqrt{' +
            numeroMath(
                radicando
            ) +
            '}';

    }


    let x1Numerador = '';

    let x2Numerador = '';


    if (parteReal !== '') {

        x1Numerador +=
            parteReal +
            ' + ';

        x2Numerador +=
            parteReal +
            ' - ';

    }


    x1Numerador +=
        parteImag;


    x2Numerador +=
        parteImag;


    let x1Final;

    let x2Final;


    if (denominador === 1) {

        x1Final =
            x1Numerador;

        x2Final =
            x2Numerador;

    }

    else {

        x1Final =
            fracao(
                x1Numerador,
                numeroMath(
                    denominador
                )
            );

        x2Final =
            fracao(
                x2Numerador,
                numeroMath(
                    denominador
                )
            );

    }


    const realDecimal =
        -b /
        (2*a);


    const imagDecimal =
        Math.sqrt(
            moduloDelta
        ) /
        (2*a);


    document
        .getElementById(
            'complexas'
        )
        .innerHTML = `


        <div class="passo">

            <span
                class="metodo"
                style="
                    background:#ede9fe;
                    color:#6d28d9;
                ">

                Números Complexos

            </span>


            <h3>
                3. Reescrevendo o Discriminante
            </h3>


            <div class="matematica">

                \\[
                \\Delta=
                ${numeroMath(delta)}
                \\]

                Como
                \\(
                \\Delta<0
                \\):

                \\[
                \\sqrt{\\Delta}
                =
                \\sqrt{
                -${numeroMath(
                    moduloDelta
                )}
                }
                \\]

                Como:

                \\[
                \\sqrt{-1}=i
                \\]

                temos:

                \\[
                \\sqrt{\\Delta}
                =
                i\\sqrt{
                ${numeroMath(
                    moduloDelta
                )}
                }
                \\]

            </div>

        </div>


        <div class="passo">

            <h3>
                4. Simplificando a Raiz
            </h3>


            <div class="matematica">

                ${
                    fator !== 1

                    ?

                    `

                    \\[
                    ${numeroMath(
                        moduloDelta
                    )}
                    =
                    ${numeroMath(fator)}^2
                    \\cdot
                    ${numeroMath(radicando)}
                    \\]

                    \\[
                    \\sqrt{
                    ${numeroMath(moduloDelta)}
                    }
                    =
                    ${raizSimplificada}
                    \\]

                    \\[
                    \\boxed{
                    \\sqrt{\\Delta}
                    =
                    i${raizSimplificada}
                    }
                    \\]

                    `

                    :

                    `

                    \\[
                    \\boxed{
                    \\sqrt{\\Delta}
                    =
                    i${raizSimplificada}
                    }
                    \\]

                    `
                }

            </div>

        </div>


        <div class="passo">

            <h3>
                5. Substituindo na Fórmula Resolutiva
            </h3>


            <div class="matematica">

                \\[
                x=
                \\frac{
                -b\\pm\\sqrt{\\Delta}
                }{
                2a
                }
                \\]

                \\[
                x=
                \\frac{
                -(${numeroMath(b)})
                \\pm
                i${raizSimplificada}
                }{
                2(${numeroMath(a)})
                }
                \\]

            </div>

        </div>

        <div
            class="resultado"
            style="
                background:#f5f3ff;
                border-color:#8b5cf6;
            "
        >

            <h2
                style="
                    color:#6d28d9;
                "
            >

                Raízes Complexas

            </h2>


            <div class="raizes">


                <div class="raiz">

                    \\[
                    x_1=
                    ${x1Final}
                    \\]


                    <div class="aproximacao">

                        Aproximação:

                        \\[
                        x_1\\approx
                        ${numeroBR(realDecimal)}
                        +
                        ${numeroBR(
                            Math.abs(
                                imagDecimal
                            )
                        )}i
                        \\]

                    </div>

                </div>


                <div class="raiz">

                    \\[
                    x_2=
                    ${x2Final}
                    \\]


                    <div class="aproximacao">

                        Aproximação:

                        \\[
                        x_2\\approx
                        ${numeroBR(realDecimal)}
                        -
                        ${numeroBR(
                            Math.abs(
                                imagDecimal
                            )
                        )}i
                        \\]

                    </div>

                </div>


            </div>

        </div>

    `;


    MathJax.typesetPromise();

}


/* =========================================================
   RAÍZES COMPLEXAS — EQUAÇÃO INCOMPLETA b = 0
   ========================================================= */


function obterRaizesComplexasIncompleta() {


    const a =
        parseFloat(
            document.getElementById(
                'a'
            ).value
        );


    const b =
        parseFloat(
            document.getElementById(
                'b'
            ).value
        );


    const c =
        parseFloat(
            document.getElementById(
                'c'
            ).value
        );


    const valor =
        -c / a;


    const modulo =
        Math.abs(valor);


    const raiz =
        Math.sqrt(modulo);


    let forma;


    if (
        Number.isInteger(modulo)
    ) {


        const simplificacao =
            simplificarRadical(
                modulo
            );


        if (
            simplificacao.fator === 1
        ) {

            forma =
                '\\sqrt{' +
                numeroMath(
                    simplificacao.radicando
                ) +
                '}';

        }

        else {

            forma =
                numeroMath(
                    simplificacao.fator
                ) +
                '\\sqrt{' +
                numeroMath(
                    simplificacao.radicando
                ) +
                '}';

        }

    }

    else {

        forma =
            '\\sqrt{' +
            numeroMath(modulo) +
            '}';

    }


    const x1 =
        'i' + forma;


    const x2 =
        '-i' + forma;


    const complexo =
        document.getElementById(
            'complexasIncompleta'
        );


    complexo.innerHTML = `

        <div class="passo">

            <span
                class="metodo"
                style="
                    background:#ede9fe;
                    color:#6d28d9;
                ">

                Números Complexos

            </span>


            <h3>
                2. Utilizando a Unidade Imaginária
            </h3>


            <div class="matematica">

                Como:

                \\[
                x^2=
                ${numeroMath(valor)}
                \\]

                podemos escrever:

                \\[
                x^2=
                -${numeroMath(modulo)}
                \\]

                Como:

                \\[
                i^2=-1
                \\]

                então:

                \\[
                x=
                \\pm
                i
                \\sqrt{
                ${numeroMath(modulo)}
                }
                \\]

            </div>

        </div>


        ${
            (
                Number.isInteger(modulo) &&
                simplificarRadical(modulo).fator !== 1
            )

            ?

            `

            <div class="passo">

                <h3>
                    3. Simplificando a Raiz
                </h3>

                <div class="matematica">

                    \\[
                    ${numeroMath(modulo)}
                    =
                    ${numeroMath(
                        simplificarRadical(
                            modulo
                        ).fator
                    )}^2
                    \\cdot
                    ${numeroMath(
                        simplificarRadical(
                            modulo
                        ).radicando
                    )}
                    \\]

                    \\[
                    \\sqrt{
                    ${numeroMath(modulo)}
                    }
                    =
                    ${forma}
                    \\]

                </div>

            </div>

            `

            :

            ''

        }


        <div class="passo">

            <h3>
                4. Resultado
            </h3>

            <div class="matematica">

                \\[
                \\boxed{
                x_1=
                ${x1}
                }
                \\]

                \\[
                \\boxed{
                x_2=
                ${x2}
                }
                \\]

            </div>

        </div>


        <div
            class="resultado"
            style="
                background:#f5f3ff;
                border-color:#8b5cf6;
            "
        >

            <h2
                style="
                    color:#6d28d9;
                "
            >

                Raízes Complexas

            </h2>


            <div class="raizes">


                <div class="raiz">

                    \\[
                    x_1=
                    ${x1}
                    \\]

                    <div class="aproximacao">

                        Aproximação:

                        \\[
                        x_1\\approx
                        ${numeroBR(raiz)}i
                        \\]

                    </div>

                </div>


                <div class="raiz">

                    \\[
                    x_2=
                    ${x2}
                    \\]

                    <div class="aproximacao">

                        Aproximação:

                        \\[
                        x_2\\approx
                        -${numeroBR(raiz)}i
                        \\]

                    </div>

                </div>


            </div>

        </div>

    `;


    MathJax.typesetPromise();

}
